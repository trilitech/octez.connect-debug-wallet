name: Build and Deploy

on: push

jobs:
  build_angular:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v2

      - name: Cache node modules
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-
      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22.x

      - name: Prepare
        run: npm ci

      # - name: Prettier
      #   run: npm run actions:prettier

      - name: Build
        run: npm run build:prod

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: angular_dist
          path: dist

  deploy_s3:
    needs: build_angular
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest

    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: angular_dist
          path: dist

      - name: Detect S3 bucket region
        id: bucket
        run: |
          # S3 returns the bucket's home region in this header even on an
          # unauthenticated 403, so no region secret is needed. Path-style
          # request keeps this working for bucket names that contain dots.
          REGION=$(curl -sI "https://s3.amazonaws.com/${{ secrets.S3_BUCKET }}" \
            | tr -d '\r' | awk 'tolower($1) == "x-amz-bucket-region:" { print $2 }')
          REGION="${REGION:-us-east-1}"
          echo "Detected bucket region: $REGION"
          echo "region=$REGION" >> "$GITHUB_OUTPUT"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ steps.bucket.outputs.region }}

      - name: Sync to S3
        run: |
          # Hashed assets are immutable — cache them for a year.
          aws s3 sync dist/octez.connect-debug-wallet/ "s3://${{ secrets.S3_BUCKET }}/" \
            --delete \
            --cache-control "public,max-age=31536000,immutable" \
            --exclude index.html
          # index.html must never be cached, so new deploys are picked up immediately.
          aws s3 cp dist/octez.connect-debug-wallet/index.html "s3://${{ secrets.S3_BUCKET }}/index.html" \
            --cache-control "no-cache,no-store,must-revalidate" \
            --content-type "text/html"

      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }}" \
            --paths "/*"
